rule_id: conflict_of_interest_risk.repeated_committee_linked_trading.v1
dimension: conflict_of_interest_risk
version: 1

# v1 decision: threshold-based, not statistical.

inputs:
  - name: transaction_records
    required: true
    description: Disclosed transactions with dates, values, and normalized sectors.
  - name: committee_memberships
    required: true
    description: Effective-dated committee service records for the member.
  - name: committee_sector_map
    required: true
    description: Versioned committee-to-sector mapping artifact.

conditions:
  missing_data_policy: no_fire
  all_of:
    - fact: committee_sector
      operator: is_not_null
    - fact: matching_transaction_count
      operator: gte
      value_ref: parameters.minimum_matching_transactions
    - fact: distinct_trade_days
      operator: gte
      value_ref: parameters.minimum_distinct_trade_days
    - fact: service_overlap_days
      operator: gte
      value_ref: parameters.minimum_overlap_days

parameters:
  minimum_matching_transactions: 2
  minimum_distinct_trade_days: 2
  minimum_overlap_days: 1

severity: high

source_types_required:
  - transaction
  - committee_membership
  - committee_sector_map

explanation_template: >-
  The member made {matching_transaction_count} committee-linked trades
  across {distinct_trade_days} trade days while serving on {committee_name};
  the rule uses a fixed count threshold, not a statistical model.
