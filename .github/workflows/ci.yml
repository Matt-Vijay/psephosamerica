name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format check
        run: ruff format --check src/ tests/
      - name: bandit security scan
        run: python -m bandit -q -c bandit.yml -r src/

  compile:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: compileall
        run: python -m compileall -q src/ tests/

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: mypy
        run: python -m mypy --config-file pyproject.toml

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: pytest unit with coverage gate
        run: |
          python -m coverage run -m pytest tests/ -q --ignore=tests/integration
          python -m coverage report --fail-under=90

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openpact
          POSTGRES_PASSWORD: openpact
          POSTGRES_DB: openpact_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U openpact"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      OPENPACT_TEST_POSTGRES_DSN: "postgresql://openpact:openpact@localhost:5432/openpact_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: pytest integration
        run: python -m pytest tests/integration/ -x -q

  benchmark-gate:
    name: Benchmark no-regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Brier/log-loss must not regress on the cross-pressured benchmark slice
        # Deterministic synthetic benchmark (no DB); fails on any unapproved
        # Brier/log-loss regression vs the committed baseline. To deliberately
        # accept a change, regenerate the pin with `--update-baseline` in the PR.
        run: |
          python -m src.runtime.prediction_benchmark_gate \
            --from-synthetic 20260608 \
            --baseline benchmarks/prediction_baseline.json \
            --tolerance 0.01
      - name: Real-data no-regression gate (committed House sample)
        # Recomputes per-slice Brier/log-loss on a committed real House vote
        # sample (clerk.house.gov roll-calls) and fails on any regression > 0.005
        # vs the pinned real baseline. Re-pin with --update-baseline to accept.
        run: |
          python -m src.runtime.prediction_benchmark_gate \
            --from-real-corpus benchmarks/real_house_sample.jsonl \
            --window 118th-h2 \
            --baseline benchmarks/prediction_real_baseline.json \
            --tolerance 0.005
      - name: Cross-pressured slice must not regress (the votes worth predicting)
        # Dedicated gate on the cross-pressured slice (real House sample): fails on
        # Brier/log-loss regression > 0.005 vs the pinned cross-pressured baseline.
        run: |
          python -m src.runtime.prediction_benchmark_gate \
            --from-real-corpus benchmarks/real_house_sample.jsonl \
            --window 118th-h2 \
            --baseline benchmarks/prediction_cross_pressured_baseline.json \
            --tolerance 0.005
