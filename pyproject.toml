[project]
name = "psephosamerica"
version = "0.1.0"
description = "Provenance-preserving public-record research and executable evaluation"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.2,<2",
    "pyarrow>=18,<25",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "defusedxml>=0.7,<1",
    "numpy>=2.1,<3",
]

[project.scripts]
psephos-regpatch = "src.regpatch.cli:main"

[project.optional-dependencies]
pdf = [
    "pypdf>=4,<6",
    "pdfplumber>=0.11,<1",
]
# Optional local semantic embedder. Exact pins preserve recorded vector fingerprints;
# neither the core package nor routine development tooling installs this runtime.
enrichment = [
    "sentence-transformers==5.5.1",
    "torch==2.12.0",
]
dev = [
    "pytest>=8,<9",
    "ruff==0.16.5",
    "mypy>=1.10,<2",
    "types-defusedxml>=0.7,<1",
    "pypdf>=4,<6",
    "pdfplumber>=0.11,<1",
    "fpdf2>=2.7,<3",
    "bandit[toml]>=1.7,<2",
    "coverage>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["src"]
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# PyArrow's Parquet API is untyped; keep our own sink/caller signatures strict.
untyped_calls_exclude = ["pyarrow.parquet"]

[[tool.mypy.overrides]]
# Optional adapters must type-check without installing model runtimes or PDF extras.
module = ["sentence_transformers.*", "torch.*", "pdfplumber.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Freeze the reviewable rule set instead of inheriting changing tool defaults.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
# Preserve public enum/type-alias/generic runtime behavior during modernization.
ignore = ["UP040", "UP042", "UP046", "UP047"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Glue/entry points whose only job is to wire argv -> a tested function.
exclude_also = [
    "if __name__ == .__main__.:",
]
