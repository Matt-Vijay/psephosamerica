[project]
name = "openpact"
version = "0.1.0"
description = "Evidence-first public ledger of score-changing events for Members of Congress"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4,<6",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4,<1",
    "pypdf>=4,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
