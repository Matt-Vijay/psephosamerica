[project]
name = "openpact"
version = "0.1.0"
description = "Evidence-first public ledger of score-changing events for Members of Congress"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
pdf = [
    "pypdf>=4,<6",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-defusedxml>=0.7,<1",
    "pypdf>=4,<6",
    "bandit[toml]>=1.7,<2",
    "coverage>=7,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["src"]
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
# Glue/entry points whose only job is to wire argv -> a tested function.
exclude_also = [
    "if __name__ == .__main__.:",
]
