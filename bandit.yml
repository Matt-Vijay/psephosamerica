# Bandit security linter configuration for psephosamerica.
# Minimal config: skip tests directory, disable noisy low-signal checks.
skips:
  - B101  # assert used in test and validation code; harmless
  - B404  # import subprocess — not used in prod paths
  - B311  # random.Random — seeded, deterministic RNG for ensembles/benchmarks, not crypto

exclude_dirs:
  - tests
  - .venv
